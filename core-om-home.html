<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核心网运维智能体</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif; }
        .sidebar { background: #f7f8fa; border-right: 1px solid #e8e8e8; }
        .main-bg { background: #f7f8fa; }
        .prompt-pill {
            transition: background .15s, border-color .15s, transform .1s;
        }
        .prompt-pill:hover { background: #e8f3ff; border-color: #91caff; }
        .sub-agent-btn.active { background: #e6f4ff; border-color: #1677ff; color: #1677ff; }
        .mode-btn.active { background: #1677ff; color: #fff; border-color: #1677ff; }
        .msg-user { background: #e6f4ff; border: 1px solid #91caff; }
        .msg-ai { background: #fff; border: 1px solid #e8e8e8; }
        .order-link { color: #1677ff; cursor: pointer; text-decoration: underline; font-weight: 500; }
        .order-link:hover { color: #0958d9; }
        .step-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin: 0 1px; }
        .step-done { background: #52c41a; }
        .step-current { background: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.25); }
        .step-todo { background: #d9d9d9; }
        #detail-panel { box-shadow: -4px 0 24px rgba(0,0,0,.06); background: #f7f8fa; }
        .thin-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .thin-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        /* 右侧详情占半屏（点击工单编号后才出现） */
        #view-session.detail-open #chat-column { flex: none; width: 50%; }
        #view-session.detail-open #detail-panel { width: 50%; }
        #detail-panel { width: 50%; }

        /* 浅色详情：步骤条与信令 tabs */
        .step-chip { border: 1px solid #e5e7eb; background: #f5f5f5; color: #6b7280; }
        .step-chip.done { background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.35); color: #047857; }
        .step-chip.current { background: rgba(59,130,246,.1); border-color: rgba(59,130,246,.35); color: #1d4ed8; }
        .sig-tab { background: #f5f5f5; border: 1px solid #e5e7eb; color: #4b5563; }
        .sig-tab.active { background: #e6f4ff; border-color: #91caff; color: #1677ff; }
        .follow-chip { background: #f5f5f5; border: 1px solid #e8e8e8; color: #1f2937; }
        .follow-chip:hover { background: #ececec; }
        .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 50; }
    </style>
</head>
<body class="min-h-screen bg-[#f7f8fa] text-gray-800 overflow-hidden">
    <div id="app" class="flex h-screen">
        <!-- 左侧：仅 Logo / 新对话 / 历史对话 -->
        <aside class="sidebar w-[260px] shrink-0 flex flex-col h-full">
            <div class="p-4 border-b border-gray-200">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#1677ff] to-[#0958d9] flex items-center justify-center text-white font-bold text-[10px] relative overflow-hidden shadow-md">
                        <span class="relative z-10 whitespace-nowrap">F-Agent</span>
                        <div class="absolute top-0 right-0 w-4 h-4 bg-white/10 rounded-bl-full"></div>
                        <div class="absolute bottom-0 left-0 w-3 h-3 bg-white/5 rounded-tr-full"></div>
                    </div>
                    <span class="font-semibold text-gray-900 text-[15px]">核心网运维智能体</span>
                </div>
                <button type="button" id="btn-new-chat"
                        class="w-full py-2.5 rounded-xl bg-[#e6f4ff] hover:bg-[#bae0ff] text-[#1677ff] text-sm font-medium border border-[#91caff] transition">
                    <i class="fas fa-plus mr-1.5 text-xs"></i>新对话
                </button>
            </div>
            <div class="flex-1 overflow-y-auto thin-scroll px-3 py-3">
                <div class="text-xs text-gray-500 font-medium mb-2 px-1">历史对话</div>
                <ul id="history-list" class="space-y-0.5 text-sm">
                </ul>
            </div>
            <div class="p-3 border-t border-gray-200 text-xs text-gray-500">
                <span class="text-gray-400">用户</span> 运维账号
            </div>
        </aside>

        <!-- 主区 -->
        <div class="flex-1 flex flex-col min-w-0 main-bg relative">
            <header class="shrink-0 flex justify-between items-center px-6 py-3 border-b border-gray-200 bg-white/80 backdrop-blur">
                <div class="text-xs text-gray-500" id="header-sub">
                    <span id="view-label">新对话</span>
                    <span class="mx-2 text-gray-300">|</span>
                    <span>内容由模型 AI 生成</span>
                </div>
                <button type="button" class="text-sm text-gray-600 hover:text-[#1677ff]">退出登录</button>
            </header>

            <!-- 首页视图 -->
            <div id="view-home" class="flex-1 flex flex-col min-h-0 overflow-hidden">
                <div class="flex-1 flex flex-col items-center justify-center px-6 pb-32 overflow-y-auto thin-scroll">
                    <h1 class="text-2xl md:text-3xl font-semibold text-gray-900 text-center mb-10">有什么我能帮你的吗?</h1>
                    <div id="help-prompts" class="w-full max-w-3xl flex flex-col items-center gap-3">
                        <!-- 三行错落提示按钮 -->
                        <div class="flex flex-wrap justify-center gap-2">
                            <button type="button" class="prompt-pill px-4 py-2.5 rounded-2xl bg-white border border-gray-200 text-sm text-gray-700 shadow-sm max-w-md text-left" data-prompt="请查询最近1天全国核心网运行情况;">请查询最近1天全国核心网运行情况；</button>
                        </div>
                        <div class="flex flex-wrap justify-center gap-2">
                            <button type="button" class="prompt-pill px-4 py-2.5 rounded-2xl bg-white border border-gray-200 text-sm text-gray-700 shadow-sm" data-prompt="请查询青海最近7天的告警工单；">请查询青海最近7天的告警工单；</button>
                            <button type="button" class="prompt-pill px-4 py-2.5 rounded-2xl bg-white border border-gray-200 text-sm text-gray-700 shadow-sm ring-2 ring-[#1677ff]/20" data-prompt="请查询青海最近7天的投诉工单；" data-special="qinghai-complaint">请查询青海最近7天的投诉工单；</button>
                        </div>
                        <div class="flex flex-wrap justify-center gap-2">
                            <button type="button" class="prompt-pill px-4 py-2.5 rounded-2xl bg-white border border-gray-200 text-sm text-gray-700 shadow-sm" data-prompt="请查询西藏最近7天的告警工单；">请查询西藏最近7天的告警工单；</button>
                            <button type="button" class="prompt-pill px-4 py-2.5 rounded-2xl bg-white border border-gray-200 text-sm text-gray-700 shadow-sm" data-prompt="请查询西藏最近7天的投诉工单；">请查询西藏最近7天的投诉工单；</button>
                        </div>
                        <div class="flex flex-wrap justify-center gap-2">
                            <button type="button" class="prompt-pill px-4 py-2.5 rounded-2xl bg-white border border-gray-200 text-sm text-gray-700 shadow-sm max-w-lg text-left" data-prompt="如何针对割接脚本进行自动核查？">如何针对割接脚本进行自动核查？</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 会话视图（中部对话 + 可选右侧详情） -->
            <div id="view-session" class="hidden flex-1 flex min-h-0">
                <div id="chat-column" class="flex-1 flex flex-col min-w-0 border-r border-gray-200 bg-[#f7f8fa]">
                    <div id="chat-scroll" class="flex-1 overflow-y-auto thin-scroll px-6 py-6 space-y-4"></div>
                </div>
                <aside id="detail-panel" class="hidden shrink-0 flex flex-col border-l border-gray-200 bg-[#f7f8fa]">
                    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200">
                        <h2 class="text-base font-semibold text-gray-900">投诉处理详情</h2>
                        <button type="button" id="btn-close-detail" class="text-gray-500 hover:text-gray-800 p-1"><i class="fas fa-times text-lg"></i></button>
                    </div>
                    <div id="detail-body" class="flex-1 overflow-y-auto thin-scroll px-4 py-4 text-sm"></div>
                </aside>
            </div>

            <!-- 底部：自然语言交互（首页与会话共用） -->
            <div class="shrink-0 border-t border-gray-200 bg-white px-4 py-3">
                <div class="max-w-4xl mx-auto">
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                        <label class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-gray-200 text-xs text-gray-600 cursor-pointer hover:bg-gray-50">
                            <i class="fas fa-paperclip"></i>
                            <span>附件</span>
                            <input type="file" class="hidden" id="file-input" multiple>
                        </label>
                        <div class="flex rounded-lg border border-gray-200 overflow-hidden text-xs">
                            <button type="button" class="mode-btn px-3 py-1.5 bg-white text-gray-600" data-mode="think">思考模式</button>
                            <button type="button" class="mode-btn active px-3 py-1.5 bg-white text-gray-600 border-l border-gray-200" data-mode="normal">普通模式</button>
                        </div>
                        <span class="text-gray-300">|</span>
                        <span class="text-xs text-gray-500">子智能体</span>
                        <button type="button" class="sub-agent-btn px-2.5 py-1 rounded-lg border border-gray-200 text-xs text-gray-600 relative" data-agent="fault">故障抢通</button>
                        <button type="button" class="sub-agent-btn px-2.5 py-1 rounded-lg border border-gray-200 text-xs text-gray-600 relative" data-agent="alarm">告警处理</button>
                        <button type="button" class="sub-agent-btn px-2.5 py-1 rounded-lg border border-gray-200 text-xs text-gray-600 relative" data-agent="complaint">投诉处理</button>
                        <button type="button" class="sub-agent-btn px-2.5 py-1 rounded-lg border border-gray-200 text-xs text-gray-600 relative" data-agent="script">脚本核查</button>
                    </div>
                    <div class="flex items-end gap-2 rounded-2xl border border-gray-200 bg-gray-50 px-3 py-2 focus-within:border-[#1677ff] focus-within:ring-1 focus-within:ring-[#1677ff]/20">
                        <textarea id="composer" rows="1" class="flex-1 bg-transparent text-sm text-gray-800 placeholder-gray-400 outline-none resize-none max-h-32 py-2"
                                  placeholder="请提供工单号，描述你想要查询的投诉工单问题；"></textarea>
                        <button type="button" id="btn-send" class="w-10 h-10 shrink-0 rounded-full bg-[#1677ff] hover:bg-[#0958d9] flex items-center justify-center text-white transition mb-0.5">
                            <i class="fas fa-paper-plane text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        const STEPS = ['自动接单', '分类提参', '签约查询', '信令分析', '工单回填', '闭环确认'];
        const MOCK_QINGHAI = [
            { id: 1, orderNo: 'QH-063-250401-00001', msisdn: '139****9733', content: '漫游地数据无法激活，多次拨测失败', createdAt: '2025-04-08 09:12:33', step: 3 },
            { id: 2, orderNo: 'QH-063-250407-00015', msisdn: '136****8818', content: '语音主叫单通，被叫侧无声', createdAt: '2025-04-07 14:22:01', step: 5 },
            { id: 3, orderNo: 'QH-063-250405-00008', msisdn: '155****1200', content: '物联网卡上网速率不达标', createdAt: '2025-04-05 11:05:44', step: 2 },
        ];

        const chatScroll = document.getElementById('chat-scroll');
        const viewHome = document.getElementById('view-home');
        const viewSession = document.getElementById('view-session');
        const detailPanel = document.getElementById('detail-panel');
        const detailBody = document.getElementById('detail-body');
        const composer = document.getElementById('composer');
        const viewLabel = document.getElementById('view-label');

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function renderProgressCell(stepIndex) {
            var idx = Math.min(Math.max(stepIndex, 0), 5);
            var html = '<div class="flex items-center gap-0.5 mb-1">';
            for (var i = 0; i < 6; i++) {
                var cls = 'step-todo';
                if (i < idx) cls = 'step-done';
                else if (i === idx) cls = 'step-current';
                html += '<span class="step-dot ' + cls + '" title="' + STEPS[i] + '"></span>';
            }
            html += '</div>';
            html += '<div class="text-xs text-gray-500">当前环节：' + STEPS[idx] + '</div>';
            return html;
        }

        function renderFollowUpChips() {
            return (
                '<div class="flex flex-col gap-2 w-full max-w-lg">' +
                '<button type="button" class="follow-chip w-full flex items-center justify-between gap-3 px-4 py-2.5 rounded-full text-sm">' +
                '<span>查询7天内已回单的投诉工单</span><i class="fas fa-arrow-right text-gray-400 text-xs"></i></button>' +
                '<button type="button" class="follow-chip w-full flex items-center justify-between gap-3 px-4 py-2.5 rounded-full text-sm">' +
                '<span>查询7天内未回单的投诉工单</span><i class="fas fa-arrow-right text-gray-400 text-xs"></i></button>' +
                '</div>'
            );
        }

        function renderTable() {
            let rows = '';
            MOCK_QINGHAI.forEach(function (row) {
                rows += '<tr class="border-b border-gray-100 hover:bg-gray-50">';
                rows += '<td class="px-3 py-2 text-gray-600">' + row.id + '</td>';
                rows += '<td class="px-3 py-2"><span class="order-link" data-order="' + escapeHtml(row.orderNo) + '">' + escapeHtml(row.orderNo) + '</span></td>';
                rows += '<td class="px-3 py-2">' + escapeHtml(row.msisdn) + '</td>';
                rows += '<td class="px-3 py-2 max-w-[200px] truncate" title="' + escapeHtml(row.content) + '">' + escapeHtml(row.content) + '</td>';
                rows += '<td class="px-3 py-2 whitespace-nowrap text-gray-600">' + escapeHtml(row.createdAt) + '</td>';
                rows += '<td class="px-3 py-2 min-w-[140px]">' + renderProgressCell(row.step) + '</td>';
                rows += '</tr>';
            });
            return (
                '<div class="overflow-x-auto rounded-lg border border-gray-200 bg-white shadow-sm">' +
                '<table class="w-full text-sm text-left">' +
                '<thead><tr class="bg-gray-50 text-gray-700 border-b border-gray-200">' +
                '<th class="px-3 py-2 font-medium">编号</th>' +
                '<th class="px-3 py-2 font-medium">工单编号</th>' +
                '<th class="px-3 py-2 font-medium">投诉号码</th>' +
                '<th class="px-3 py-2 font-medium">投诉内容</th>' +
                '<th class="px-3 py-2 font-medium">产生时间</th>' +
                '<th class="px-3 py-2 font-medium">工单处理进度</th>' +
                '</tr></thead><tbody>' + rows + '</tbody></table>' +
                '<div class="px-3 py-2 text-xs text-gray-500 bg-gray-50 border-t border-gray-200">进度说明：' + STEPS.join(' → ') + '</div>' +
                '</div>'
            );
        }

        function detailHtml(orderNo) {
            const row = MOCK_QINGHAI.find(function (r) { return r.orderNo === orderNo; }) || MOCK_QINGHAI[0];
            const si = row.step;
            const lightCard = 'rounded-xl border border-gray-200 bg-white shadow-sm text-gray-800';
            const subText = 'text-[12px] text-gray-500';
            const label = 'text-[12px] text-gray-500';
            const value = 'text-[13px] text-gray-900';

            // 顶部进度条（不放在“工单信息”卡片内部）
            let topSteps = '<div class="' + lightCard + ' p-4">' +
                '<div class="flex items-center justify-between gap-3">' +
                '<div class="text-[14px] font-semibold text-gray-900"><i class="fas fa-route mr-2 text-gray-600"></i>处理进度</div>' +
                '<div class="' + subText + '">当前环节：<span class="text-gray-900 font-medium">' + escapeHtml(STEPS[si]) + '</span></div>' +
                '</div>' +
                '<div class="mt-3 flex flex-wrap gap-2">';
            STEPS.forEach(function (name, i) {
                let cls = 'step-chip';
                if (i < si) cls += ' done';
                else if (i === si) cls += ' current';
                topSteps += '<span class="' + cls + ' text-[12px] px-2.5 py-1 rounded-lg">' + (i + 1) + '. ' + name + '</span>';
            });
            topSteps += '</div></div>';

            // 交互消息（截图3字段更像：时间/主叫/被叫/网元节点/消息/结果/时延）
            const interactionTable = (
                '<div class="overflow-x-auto mt-3 rounded-lg border border-gray-200 bg-gray-50">' +
                '<table class="w-full text-[12px] text-left text-gray-800">' +
                '<thead><tr class="bg-gray-100 text-gray-600 border-b border-gray-200">' +
                '<th class="px-3 py-2 font-medium">时间</th>' +
                '<th class="px-3 py-2 font-medium">主叫</th>' +
                '<th class="px-3 py-2 font-medium">被叫</th>' +
                '<th class="px-3 py-2 font-medium">网元节点</th>' +
                '<th class="px-3 py-2 font-medium">消息</th>' +
                '<th class="px-3 py-2 font-medium">结果</th>' +
                '<th class="px-3 py-2 font-medium">时延(s)</th>' +
                '</tr></thead>' +
                '<tbody>' +
                '<tr class="border-b border-gray-100 hover:bg-white">' +
                '<td class="px-3 py-2">2025-12-01 15:22:44.170</td>' +
                '<td class="px-3 py-2">+8613******22</td>' +
                '<td class="px-3 py-2">05711****</td>' +
                '<td class="px-3 py-2">UE→P-CSCF</td>' +
                '<td class="px-3 py-2 font-semibold">INVITE</td>' +
                '<td class="px-3 py-2"><span class="px-2 py-0.5 rounded bg-green-50 text-green-700 border border-green-200">成功</span></td>' +
                '<td class="px-3 py-2">2.802</td>' +
                '</tr>' +
                '<tr class="border-b border-gray-100 hover:bg-white">' +
                '<td class="px-3 py-2">2025-12-01 15:22:44.210</td>' +
                '<td class="px-3 py-2">+8613******22</td>' +
                '<td class="px-3 py-2">05711****</td>' +
                '<td class="px-3 py-2">P-CSCF→I-CSCF</td>' +
                '<td class="px-3 py-2 font-semibold">INVITE</td>' +
                '<td class="px-3 py-2"><span class="px-2 py-0.5 rounded bg-green-50 text-green-700 border border-green-200">成功</span></td>' +
                '<td class="px-3 py-2">0.120</td>' +
                '</tr>' +
                '<tr class="border-b border-gray-100 hover:bg-white">' +
                '<td class="px-3 py-2">2025-12-01 15:22:44.520</td>' +
                '<td class="px-3 py-2">+8613******22</td>' +
                '<td class="px-3 py-2">05711****</td>' +
                '<td class="px-3 py-2">S-CSCF→P-CSCF</td>' +
                '<td class="px-3 py-2 font-semibold">100 TRYING</td>' +
                '<td class="px-3 py-2"><span class="px-2 py-0.5 rounded bg-green-50 text-green-700 border border-green-200">成功</span></td>' +
                '<td class="px-3 py-2">0.090</td>' +
                '</tr>' +
                '<tr class="hover:bg-white">' +
                '<td class="px-3 py-2">2025-12-01 15:22:47.020</td>' +
                '<td class="px-3 py-2">+8613******22</td>' +
                '<td class="px-3 py-2">05711****</td>' +
                '<td class="px-3 py-2">P-CSCF→UE</td>' +
                '<td class="px-3 py-2 font-semibold">CANCEL</td>' +
                '<td class="px-3 py-2"><span class="px-2 py-0.5 rounded bg-red-50 text-red-700 border border-red-200">失败</span></td>' +
                '<td class="px-3 py-2">0.060</td>' +
                '</tr>' +
                '</tbody></table></div>'
            );

            // 业务流程图（时序图）+ 泳道图（示意）
            const flowSeq = (
                '<div class="mt-3 rounded-lg border border-gray-200 bg-white p-3 shadow-sm">' +
                '<div class="text-[12px] text-gray-700 font-medium mb-2">业务流程信令泳道图</div>' +
                '<div class="text-[11px] text-gray-500 mb-2">已选：注册（2025-12-01 15:26:06.210）</div>' +
                '<div class="relative overflow-x-auto rounded-lg border border-gray-200 bg-gray-50 p-3">' +
                '<div class="min-w-[720px]">' +
                '<div class="grid grid-cols-6 gap-2 text-[11px] text-gray-600 mb-2">' +
                '<div>UE</div><div>P-CSCF</div><div>I-CSCF</div><div>S-CSCF</div><div>HSS</div><div>PCF</div>' +
                '</div>' +
                '<div class="h-56 relative">' +
                '<div class="absolute inset-0 grid grid-cols-6 gap-2">' +
                '<div class="border-l border-gray-200"></div><div class="border-l border-gray-200"></div><div class="border-l border-gray-200"></div><div class="border-l border-gray-200"></div><div class="border-l border-gray-200"></div><div class="border-l border-gray-200"></div>' +
                '</div>' +
                '<div class="absolute left-0 top-6 right-0">' +
                '<div class="text-[11px] text-gray-800 mb-2"><span class="px-2 py-0.5 rounded bg-white border border-gray-200">REGISTER</span> UE → P-CSCF</div>' +

        // 历史对话管理
        const HISTORY_KEY = 'core-om-history';
        let historyList = [];

        function loadHistory() {
            const saved = localStorage.getItem(HISTORY_KEY);
            if (saved) {
                historyList = JSON.parse(saved);
            } else {
                // 初始化默认数据
                historyList = [
                    { id: Date.now() - 2, content: '查询北京今日告警工单', createdAt: new Date(Date.now() - 86400000).toLocaleString('zh-CN'), metadata: { agent: 'alarm', mode: 'normal' } },

                ];
                saveHistory();
            }
            renderHistory();
        }

        function saveHistory() {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(historyList));
        }

        function addHistoryItem(content, metadata = {}) {
            const item = {
                id: Date.now(),
                content: content,
                createdAt: new Date().toLocaleString('zh-CN'),
                metadata: metadata
            };
            historyList.unshift(item);
            saveHistory();
            renderHistory();
        }

        function deleteHistoryItem(id) {
            historyList = historyList.filter(item => item.id !== id);
            saveHistory();
            renderHistory();
        }

        function togglePin(id) {
            const index = historyList.findIndex(item => item.id === id);
            if (index === -1) return;

            const item = historyList[index];
            item.metadata = item.metadata || {};
            
            if (item.metadata.pinned) {
                // 取消置顶
                item.metadata.pinned = false;
                // 移动到底部
                historyList.splice(index, 1);
                historyList.push(item);
            } else {
                // 置顶
                item.metadata.pinned = true;
                // 移动到顶部
                historyList.splice(index, 1);
                historyList.unshift(item);
            }
            
            saveHistory();
            renderHistory();
        }

        function renameItem(id) {
            const item = historyList.find(i => i.id === id);
            if (!item) return;

            // 创建自定义重命名对话框
            const dialog = document.createElement('div');
            dialog.className = 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center';
            dialog.innerHTML = `
                <div class="bg-white rounded-lg shadow-xl p-6 max-w-md w-full">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">重命名对话</h3>
                        <button id="rename-cancel" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">对话名称</label>
                        <input type="text" id="rename-input" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1677ff] focus:border-transparent" value="${escapeHtml(item.content)}">
                    </div>
                    <div class="flex justify-end gap-2">
                        <button id="rename-cancel-btn" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">取消</button>
                        <button id="rename-confirm-btn" class="px-4 py-2 bg-[#1677ff] text-white rounded-md hover:bg-[#0958d9]">确认</button>
                    </div>
                </div>
            `;

            document.body.appendChild(dialog);

            const input = dialog.querySelector('#rename-input');
            const confirmBtn = dialog.querySelector('#rename-confirm-btn');
            const cancelBtn = dialog.querySelector('#rename-cancel-btn');
            const closeBtn = dialog.querySelector('#rename-cancel');

            input.focus();
            input.select();

            function closeDialog() {
                dialog.remove();
            }

            function handleRename() {
                const newName = input.value.trim();
                if (newName) {
                    item.content = newName;
                    saveHistory();
                    renderHistory();
                }
                closeDialog();
            }

            confirmBtn.addEventListener('click', handleRename);
            cancelBtn.addEventListener('click', closeDialog);
            closeBtn.addEventListener('click', closeDialog);

            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleRename();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeDialog();
                }
            });

            // 点击外部关闭
            dialog.addEventListener('click', (e) => {
                if (e.target === dialog) {
                    closeDialog();
                }
            });
        }

        function showActionMenu(target, id) {

                    <span>${isPinned ? '取消置顶' : '置顶'}</span>
                </button>
                <button class="w-full flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100" data-action="rename">
                    <i class="fas fa-pen text-xs text-gray-400"></i>
                    <span>重命名</span>
                </button>
                <div class="border-t border-gray-100 my-1"></div>
                <button class="w-full flex items-center gap-2 px-3 py-2 text-sm text-red-600 hover:bg-red-50" data-action="delete">
                    <i class="fas fa-trash-alt text-xs"></i>
                    <span>删除</span>
                </button>
            `;

            // 定位菜单
            const rect = target.getBoundingClientRect();
            menu.style.left = (rect.left - 160) + 'px';
            menu.style.top = (rect.bottom + 4) + 'px';

            document.body.appendChild(menu);

            // 菜单项事件
            menu.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    
                    const action = btn.dataset.action;
                    closeActionMenu();
                    
                    if (action === 'rename') {
                        setTimeout(() => {
                            renameItem(id);
                        }, 10);
                    } else if (action === 'pin') {
                        setTimeout(() => {
                            togglePin(id);
                        }, 10);
                    } else if (action === 'delete') {
                        setTimeout(() => {
                            if (confirm('确定要删除这条历史记录吗？')) {
                                deleteHistoryItem(id);
                            }
                        }, 10);
                    }
                });
            });

            // 阻止菜单本身的点击事件冒泡
            menu.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }

        function closeActionMenu() {
            const menu = document.getElementById('history-action-menu');
            if (menu) {
                menu.remove();
            }
        }

        function renderHistory() {
            const historyListEl = document.getElementById('history-list');
            if (!historyListEl) return;

            historyListEl.innerHTML = historyList.map(item => {
                const isPinned = item.metadata?.pinned || false;
                return `
                    <li class="group rounded-lg px-3 py-2.5 text-gray-700 hover:bg-gray-100 cursor-pointer border border-transparent hover:border-gray-200 bg-white relative ${isPinned ? 'bg-blue-50/50' : ''}" data-id="${item.id}">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center flex-1 min-w-0">
                                ${isPinned ? '<i class="fas fa-thumbtack text-[#1677ff] text-xs mr-2 rotate-45"></i>' : '<i class="far fa-comment-dots text-gray-400 mr-2 text-xs"></i>'}
                                <span class="truncate history-content">${escapeHtml(item.content)}</span>
                            </div>
                            <button class="history-action opacity-0 group-hover:opacity-100 transition-opacity p-1 hover:bg-gray-200 rounded" data-id="${item.id}" title="更多操作">
                                <i class="fas fa-ellipsis-h text-gray-400 text-xs"></i>
                            </button>
                        </div>
                    </li>
                `;
            }).join('');

            // 添加事件监听
            historyListEl.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', (e) => {
                    if (!e.target.closest('.history-action')) {
                        const id = parseInt(li.dataset.id);
                        const item = historyList.find(i => i.id === id);
                        if (item) {
                            console.log('Open conversation:', item);
                        }
                    }
                });
            });

            // 操作按钮事件
            historyListEl.querySelectorAll('.history-action').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    showActionMenu(btn, id);
                });
            });
        }

        function createNewHistory() {
            const activeAgent = document.querySelector('.sub-agent-btn.active')?.dataset.agent || 'complaint';
            const activeMode = document.querySelector('.mode-btn.active')?.dataset.mode || 'normal';
            addHistoryItem('新对话', { agent: activeAgent, mode: activeMode });
        }

        // 新对话按钮事件
        document.getElementById('btn-new-chat').addEventListener('click', function () {
            createNewHistory();
        });

        // 发送消息时添加到历史记录
        document.getElementById('btn-send').addEventListener('click', function () {
            const text = document.getElementById('composer').value.trim();
            if (!text) return;
            
            const activeAgent = document.querySelector('.sub-agent-btn.active')?.dataset.agent || 'complaint';
            const activeMode = document.querySelector('.mode-btn.active')?.dataset.mode || 'normal';
            addHistoryItem(text, { agent: activeAgent, mode: activeMode });
        });

        // 初始化加载历史记录
        loadHistory();
    })();
    </script>
</body>
</html>
