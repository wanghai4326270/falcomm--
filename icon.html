<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核心网运维智能体图标</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .icon-container {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e88e5 0%, #64b5f6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .icon-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
        }
        
        .icon-content {
            position: relative;
            z-index: 1;
            width: 36px;
            height: 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .network-symbol {
            width: 28px;
            height: 28px;
            position: relative;
        }
        
        .circle {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
        }
        
        .circle-1 {
            width: 28px;
            height: 28px;
            top: 0;
            left: 0;
        }
        
        .circle-2 {
            width: 18px;
            height: 18px;
            top: 5px;
            left: 5px;
        }
        
        .circle-3 {
            width: 8px;
            height: 8px;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.9);
        }
        
        .connection {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.7);
            height: 2px;
        }
        
        .connection-1 {
            width: 12px;
            top: 14px;
            left: -6px;
            transform: rotate(0deg);
        }
        
        .connection-2 {
            width: 12px;
            top: 14px;
            right: -6px;
            transform: rotate(0deg);
        }
        
        .connection-3 {
            width: 12px;
            top: -6px;
            left: 8px;
            transform: rotate(90deg);
        }
        
        .connection-4 {
            width: 12px;
            bottom: -6px;
            left: 8px;
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <div class="icon-container">
        <div class="icon-content">
            <div class="network-symbol">
                <div class="circle circle-1"></div>
                <div class="circle circle-2"></div>
                <div class="circle circle-3"></div>
                <div class="connection connection-1"></div>
                <div class="connection connection-2"></div>
                <div class="connection connection-3"></div>
                <div class="connection connection-4"></div>
            </div>
        </div>
    </div>
</body>
</html>
